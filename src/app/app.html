
<app-svg-sprite></app-svg-sprite>

@if (availableUpdate(); as update) {
    <aside class="pwa-notice" role="status" aria-live="polite">
        <span>
            Nuova versione LipariOS{{ update.version ? ' ' + update.version : '' }} disponibile.
        </span>
        <button type="button" (click)="reloadWithUpdate()">Aggiorna ora</button>
    </aside>
} @else if (canInstallPwa()) {
    <aside class="pwa-notice" role="status">
        <span>Installa LipariOS su questo dispositivo.</span>
        <button type="button" (click)="installPwa()">Installa</button>
    </aside>
}


    @if ( user(); as user ) {
        <app-header
            [user]="user"
            [isInProfilePage]="!!isInProfilePage()"
            (menuToggle)="drawerVisible = true"
        ></app-header>
    }

    <div>
        @if ( user(); as user ) {
            <div class="device tablet desktop">
                Menu
            </div>
        }
            <router-outlet />
    </div>

<p-drawer
    [(visible)]="drawerVisible"
    position="bottom"
    [modal]="true"
    [dismissible]="true"
    [showCloseIcon]="false"
    [style]="{
        height: '50vh',
        borderTopLeftRadius: '24px',
        borderTopRightRadius: '24px'
      }"
>
    <mobile-menu
        [user]="user()"
        (menuClose)="drawerVisible = false"
    ></mobile-menu>
</p-drawer>
