<div class="value-label">{{ currentLabel }}</div>

<!--
  niente viewBox: x in percentuale della larghezza e spessore in cqw (1% della larghezza del componente),
  così le tacche seguono il contenitore e le estremità restano tonde
-->
<svg
    width="100%"
    height="40"
    style="display: block; overflow: visible; touch-action: none; user-select: none;"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="premuto = false"
    (pointercancel)="premuto = false"
    (contextmenu)="$event.preventDefault()"
>
    <!--
      bagliore delle tacche attive: il tratto sfocato sotto il tratto stesso;
      userSpaceOnUse perché una linea verticale ha larghezza 0 e con le unità predefinite sparirebbe
    -->
    <defs>
        <filter id="glow" filterUnits="userSpaceOnUse" x="-5%" y="-25%" width="110%" height="150%">
            <feGaussianBlur stdDeviation="2" result="sfocato"/>
            <feMerge>
                <feMergeNode in="sfocato"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    @for (segment of segments; track segment.value) {
        <line
            stroke-linecap="round"
            [attr.stroke]="(segment.value < value) ? colors[0] : colors[1]"
            [attr.filter]="(segment.value < value) ? 'url(#glow)' : null"
            [style.stroke-width]="spessore"
            [attr.x1]="((segment.value + 0.5) * 100 / n) + '%'"
            [attr.y1]="8"
            [attr.x2]="((segment.value + 0.5) * 100 / n) + '%'"
            [attr.y2]="32"
        />
    }
</svg>
