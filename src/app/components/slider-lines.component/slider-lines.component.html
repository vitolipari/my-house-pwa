<div class="value-label">{{ currentLabel }}</div>
<div style="position: relative; width: 100%; height: 100%;">
    <div
        class="scorrimento"
        style="width: 100%; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;"
        (scroll)="onScroll($event)"
        (pointerdown)="onDrag($event)"
        (pointermove)="onDrag($event)"
        (pointerup)="onDrag($event)"
    >
        <div style="flex: 0 0 50%;"></div>
        <svg
            height="40"
            style="flex: 0 0 300%; overflow: visible;"
        >
            <g>
                @for (segment of segments; track segment.from.x) {
                    <line
                        stroke-linecap="round"
                        [attr.stroke]="segment.color || '#666'"
                        [attr.stroke-width]="segment.width || 3"
                        [attr.x1]="segment.from.x + '%'"
                        [attr.y1]="segment.from.y"
                        [attr.x2]="segment.to.x + '%'"
                        [attr.y2]="segment.to.y"
                    />
                }
                @for (step of fullSteps; track step) {
                    <text
                        class="label-value"
                        [attr.x]="step.x + '%'"
                        [attr.y]="step.y"
                    >
                        {{ step.label }}
                    </text>
                }
            </g>
        </svg>
        <div style="flex: 0 0 50%;"></div>
    </div>
    <svg
        class="indicatore"
        height="40"
    >
        <line
            x1="50%"
            y1="0"
            x2="50%"
            y2="40"
            stroke="var(--color-text-1)"
            stroke-width="0.5"
            stroke-linecap="round"
        />
    </svg>
</div>
