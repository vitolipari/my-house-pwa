<svg
    class="gauge-circle"
    style=""
    viewBox="0 0 100 100"
>
    <defs>
        <linearGradient [attr.id]="idGradiente">
            <!--
            <stop offset="0" stop-color="#00cc66"/>
            <stop [attr.offset]="offsetMedia" stop-color="#ffff00"/>
            <stop offset="1" stop-color="#ff0000"/>
            -->
            @for (colore of colori; track $index) {
                <stop [attr.offset]="$index / ($count - 1)" [attr.stop-color]="colore"/>
            }
        </linearGradient>
    </defs>
    <!-- metà piano sopra il centro, ruotata come la lancetta: scopre l'arco a sinistra della lancetta -->
    <mask [attr.id]="idGradiente +'-mask'">
        <rect
            x="-100"
            y="-100"
            width="300"
            height="200"
            fill="white"
            [attr.transform]="'rotate('+ angoloMask +' 50 100)'"
        />
    </mask>
    <circle
        [attr.r]="'90%'"
        [attr.cx]="'50%'"
        [attr.cy]="'100%'"
        fill="none"
        [attr.stroke]="'var(--middle-opacity-inverse-theme-color)'"
        [attr.stroke-width]="'10%'"
    ></circle>
    @if(!!hasColorMagnitude) {
        <circle
            [attr.r]="'90%'"
            [attr.cx]="'50%'"
            [attr.cy]="'100%'"
            fill="none"
            [attr.stroke]="'url(#'+ idGradiente +')'"
            [attr.stroke-width]="'10%'"
            [attr.mask]="'url(#'+ idGradiente +'-mask)'"
        ></circle>
    }
    <text class="gauge-text" x="-30" y="100%">{{ minimum }}</text>
    <text class="gauge-text" x="100" y="100%">{{ maximum }}</text>
</svg>
<div
    class="gauge"
    style=""
>
    <div>{{ value }}</div>
</div>
