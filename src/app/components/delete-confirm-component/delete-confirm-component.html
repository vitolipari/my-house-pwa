<div
    style="
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        "
>
    <div
        style="
                font-family: var(--page-font);
                font-size: var(--main-font-size);
                color: var(--color-text-2);
            "
    >confermi eliminazione?</div>
    <div
        style="margin: 2rem 0rem 5rem 0rem; height: 4rem;"
    >
        @if(!!isInDeleteInWaiting()) {
            <svg
                class="svg-icon"
                style="width: 3rem;"
            >
                <use href="#orologio-1-1"></use>
            </svg>
        }
        @else {
            <img
                src="/assets/images/trash.png"
                style="height: 100%"
            >
        }
    </div>
    <div>
        <div
            style="
                      cursor: pointer;
                      font-family: var(--page-font);
                      font-size: var(--main-font-size);
                      color: var(--theme-color);
                      background: var(--color-red-outer-glow);
                      border-radius: 100px;
                      padding: 0.1rem 1rem;
                "
            (click)="!isInDeleteInWaiting() ? confirmDelete() : null"
        >conferma</div>
    </div>
</div>
