<div>
    <svg
        id="navigation-back"
        (click)="goBack()"
    >
        <use href="#icon-591"></use>
    </svg>
</div>

<div>
    <section class="base-text-style debug-device" id="mobile">LipariOS | mobile</section>
    <section class="base-text-style debug-device" id="tablet">LipariOS</section>
    <section class="base-text-style debug-device" id="desktop">LipariOS | desktop</section>
</div>



<div>
    <div class="device mobile">
        <i
            style="font-size: 1.5rem !important;"
            class="pi pi-bars primeicons"
            (click)="openMobileMenu()"
        ></i>
    </div>
    <div class="device tablet desktop" style="margin-right: 1rem;">
        @if( !!user ) {
            <img
                id="header-profile-image"
                [src]="!!user ? user.picture : ''"
                (click)="gotoPage('/profile/page')"
            />
        }
        @else {
            <svg
                class="svg-icon"
                id="header-profile-image-placeholder"
                (click)="gotoPage('/profile/page')"
            >
                <use href="#header-profile-image-placeholder"></use>
            </svg>
        }
    </div>
</div>
